# =============================================================
# 接力教育智慧云平台 - Java 后端 Docker Compose 配置
# 包含：Java 后端、MySQL、Redis、Nginx
# =============================================================

version: '3.8'

services:
  # -------------------- Java 后端服务 --------------------
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: jieli-backend-java
    ports:
      - "8080:8080"
    environment:
      # 数据库配置
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/jieli_edu?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpass
      # Redis 配置
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_DATABASE=0
      # 应用配置
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - JWT_SECRET=change-this-to-a-secure-random-string-for-production
      - JWT_EXPIRATION=86400000
      # 文件上传配置
      - FILE_UPLOAD_PATH=/app/uploads
      - FILE_MAX_SIZE=104857600
    volumes:
      - ./uploads:/app/uploads
      - java_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jieli-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -------------------- MySQL 8.0 数据库 --------------------
  mysql:
    image: mysql:8.0
    container_name: jieli-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jieli_edu
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-java/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - jieli-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # -------------------- Redis 7 缓存 --------------------
  redis:
    image: redis:7-alpine
    container_name: jieli-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jieli-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- Nginx 反向代理 --------------------
  nginx:
    image: nginx:alpine
    container_name: jieli-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-java.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend-java
    networks:
      - jieli-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

# -------------------- 数据卷 --------------------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  java_logs:
    driver: local

# -------------------- 网络 --------------------
networks:
  jieli-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
