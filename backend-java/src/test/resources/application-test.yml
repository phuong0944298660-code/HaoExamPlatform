# 测试环境配置 - 使用MySQL
spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:mysql://localhost:3306/jieli_edu_test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # 禁用Redis（测试环境使用内存缓存）
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  cache:
    type: simple

# 文件上传配置
file:
  upload:
    path: /tmp/jieli-test-uploads
    max-size: 10485760  # 10MB

# JWT配置
jwt:
  secret: test-secret-key-for-testing-only-do-not-use-in-production
  expiration: 86400000

# 日志
logging:
  level:
    com.jieliedu.platform: DEBUG
    org.springframework.security: DEBUG
