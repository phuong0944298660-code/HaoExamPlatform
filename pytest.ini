# =============================================================================
# Pytest 配置文件
# 接力教育智慧云平台 - 测试配置
# =============================================================================

[pytest]
# 测试目录和文件模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步模式
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试
    smoke: 冒烟测试
    api: API 测试
    db: 数据库测试
    redis: Redis 测试
    auth: 认证相关测试
    account: 账号相关测试
    exam: 考试相关测试
    paper: 试卷相关测试
    question: 题目相关测试
    score: 成绩相关测试

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    default::Warning

# 测试发现
addopts =
    # 详细输出
    -v
    # 显示每个测试的简短 traceback
    --tb=short
    # 显示测试持续时间
    --durations=10
    # 严格标记
    --strict-markers
    # 彩色输出
    --color=yes
    # 失败时继续运行
    -r a
    # 覆盖率相关（可选，可以通过命令行覆盖）
    # --cov=app
    # --cov-report=term-missing
    # --cov-report=html

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

# 环境变量
env =
    APP_ENV=testing
    APP_DEBUG=false
    TESTING=true
