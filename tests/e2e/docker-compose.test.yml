# =============================================================================
# 接力教育智慧云平台 - E2E测试环境 Docker Compose配置
# =============================================================================
# 
# 使用方法:
#   1. 启动测试环境: docker-compose -f docker-compose.test.yml up -d
#   2. 运行测试: python tests/run_all_tests.py
#   3. 停止测试环境: docker-compose -f docker-compose.test.yml down
#
# =============================================================================

version: '3.8'

services:
  # ==========================================================================
  # 后端测试服务
  # ==========================================================================
  backend-test:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: jieli-backend-test
    ports:
      - "8001:8000"  # 测试使用8001端口
    environment:
      - DATABASE_URL=mysql+aiomysql://root:rootpass@test-db:3306/jieli_edu_test
      - REDIS_URL=redis://test-redis:6379/15
      - CELERY_BROKER_URL=redis://test-redis:6379/13
      - CELERY_RESULT_BACKEND=redis://test-redis:6379/14
      - JWT_SECRET_KEY=test-secret-key-for-e2e-testing-only
      - APP_ENV=testing
      - APP_DEBUG=true
      - APP_NAME=接力教育智慧云平台-E2E测试
      - STORAGE_TYPE=local
      - STORAGE_PATH=/app/uploads
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - test_uploads:/app/uploads
    networks:
      - jieli-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Celery Worker（测试环境）
  # ==========================================================================
  celery-worker-test:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: jieli-celery-test
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=mysql+aiomysql://root:rootpass@test-db:3306/jieli_edu_test
      - REDIS_URL=redis://test-redis:6379/15
      - CELERY_BROKER_URL=redis://test-redis:6379/13
      - CELERY_RESULT_BACKEND=redis://test-redis:6379/14
      - JWT_SECRET_KEY=test-secret-key-for-e2e-testing-only
      - APP_ENV=testing
      - APP_DEBUG=true
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - test_uploads:/app/uploads
    networks:
      - jieli-test-network
    restart: unless-stopped

  # ==========================================================================
  # Celery Beat（测试环境定时任务）
  # ==========================================================================
  celery-beat-test:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: jieli-beat-test
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=mysql+aiomysql://root:rootpass@test-db:3306/jieli_edu_test
      - REDIS_URL=redis://test-redis:6379/15
      - CELERY_BROKER_URL=redis://test-redis:6379/13
      - CELERY_RESULT_BACKEND=redis://test-redis:6379/14
      - JWT_SECRET_KEY=test-secret-key-for-e2e-testing-only
      - APP_ENV=testing
      - APP_DEBUG=true
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    networks:
      - jieli-test-network
    restart: unless-stopped

  # ==========================================================================
  # 测试MySQL数据库
  # ==========================================================================
  test-db:
    image: mysql:8.0
    container_name: jieli-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jieli_edu_test
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_INNODB_LOG_FILE_SIZE: 64M
    ports:
      - "3307:3306"
    volumes:
      - test_mysql_data:/var/lib/mysql
    networks:
      - jieli-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      mysqld
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M

  # ==========================================================================
  # 测试Redis缓存
  # ==========================================================================
  test-redis:
    image: redis:7-alpine
    container_name: jieli-redis-test
    ports:
      - "6380:6379"
    volumes:
      - test_redis_data:/data
    networks:
      - jieli-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ==========================================================================
  # 测试监控 - Prometheus (可选)
  # ==========================================================================
  prometheus-test:
    image: prom/prometheus:latest
    container_name: jieli-prometheus-test
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus-test.yml:/etc/prometheus/prometheus.yml
      - test_prometheus_data:/prometheus
    networks:
      - jieli-test-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ==========================================================================
  # 测试监控 - Grafana (可选)
  # ==========================================================================
  grafana-test:
    image: grafana/grafana:latest
    container_name: jieli-grafana-test
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - test_grafana_data:/var/lib/grafana
    networks:
      - jieli-test-network
    profiles:
      - monitoring
    restart: unless-stopped

# ============================================================================
# 数据卷定义
# ============================================================================
volumes:
  test_mysql_data:
    driver: local
  test_redis_data:
    driver: local
  test_uploads:
    driver: local
  test_prometheus_data:
    driver: local
  test_grafana_data:
    driver: local

# ============================================================================
# 网络定义
# ============================================================================
networks:
  jieli-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
