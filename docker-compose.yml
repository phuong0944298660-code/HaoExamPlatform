services:
  # =============================================================
  # Java Spring Boot 后端服务
  # 接力教育智慧云平台 - Java/Spring Boot 版本
  # =============================================================
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: jieli-backend
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/jieli_edu?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpass
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_DATABASE=0
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
      - JWT_SECRET=change-this-to-a-secure-random-string-for-production
      - JWT_EXPIRATION=86400000
      - FILE_UPLOAD_PATH=/app/uploads
      - FILE_MAX_SIZE=104857600
    volumes:
      - ./uploads:/app/uploads
      - java_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jieli-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================
  # MySQL 数据库
  # =============================================================
  db:
    image: mysql:8.0
    container_name: jieli-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jieli_edu
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jieli-network

  # =============================================================
  # Redis 缓存
  # =============================================================
  redis:
    image: redis:7-alpine
    container_name: jieli-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jieli-network

  # =============================================================
  # Nginx 反向代理
  # =============================================================
  nginx:
    image: nginx:alpine
    container_name: jieli-nginx
    ports:
      - "8001:80"
    volumes:
      - ./nginx-java.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jieli-network

  # 前端开发服务器（开发模式使用，生产环境用 nginx 托管静态文件）
  frontend:
    image: node:20-alpine
    container_name: jieli-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jieli-network

networks:
  jieli-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  java_logs:
